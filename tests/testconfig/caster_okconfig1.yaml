# Every port here is above 32767: libcyaml range-checks a CYAML_FIELD_INT against the signed
# range of the field it is bound to, so an "unsigned short port" declared as an INT field
# rejected anything over 32767.
listen:
  - port:		40110
    ip:			::1

graylog:
  - host:			::1
    port:			40111
    uri:			'/gelf'
    tls:			false
    authorization:		'29daf8491eaec44418e4f898cefa17d581964943f423b023c0d47a2e475beb65'
    log_level:			INFO
    retry_delay:		30

node:
  - host:		::1
    port:		40112
    authorization:	'29daf8491eaec44418e4f898cefa17d581964943f423b023c0d47a2e475beb65'
    tls:		false
    retry_delay:	30

proxy:
  - table_refresh_delay:	30
    host:			::1
    port:			40113

host_auth_file:		host.auth
source_auth_file:	source.auth
sourcetable_file:	sourcetable.dat
access_log:		../test-access.log
log:			../test-caster.log

log_level:		INFO
admin_user:		admin
